apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: juice-shop
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "2010"

spec:
  project: learning

  destination:
    server: https://kubernetes.default.svc
    namespace: juice-shop

  sources:

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values


    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 40-learning/20-juice-shop/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true