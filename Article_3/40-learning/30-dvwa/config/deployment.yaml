apiVersion: apps/v1
kind: Deployment

metadata:
  name: dvwa
  namespace: dvwa

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dvwa

  template:
    metadata:
      labels:
        app: dvwa

    spec:
      containers:
        - name: dvwa

          image: vulnerables/web-dvwa:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi