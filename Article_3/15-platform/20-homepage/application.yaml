apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "505"
spec:
  project: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage

  sources:
    - repoURL: https://jameswynn.github.io/helm-charts
      chart: homepage
      targetRevision: 2.1.0
      helm:
        valueFiles:
          - $values/15-platform/20-homepage/values.yaml

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 15-platform/20-homepage/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
