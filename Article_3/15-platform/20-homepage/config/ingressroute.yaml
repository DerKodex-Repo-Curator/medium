apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home
  namespace: homepage

  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
    kubernetes.io/ingress.class: traefik

spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`home.<your_domain>`)
      kind: Rule

      services:
        - name: homepage
          port: 3000

  tls:
    secretName: homepage-tls



