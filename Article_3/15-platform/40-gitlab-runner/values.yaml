gitlabUrl: https://gitlab.<your_domain>

concurrent: 5

rbac:
  create: true

serviceAccount:
  create: true

resources:
  requests:
    cpu: 500m
    memory: 500Mi

  limits:
    cpu: 2
    memory: 3Gi

runners:
  tags: "kubernetes"
  secret: gitlab-runner-secret
  runUntagged: true

  locked: false

  privileged: false

  config: |
    [[runners]]
      request_concurrency = 4

      environment = [
        "FF_USE_FASTZIP=true",
        "FF_USE_ADAPTIVE_REQUEST_CONCURRENCY=true"
      ]
      [runners.kubernetes]
        namespace = "gitlab-runner"

        image = "ubuntu:24.04"

        cpu_request = "250m"
        cpu_limit = "1500m"

        memory_request = "256Mi"
        memory_limit = "2Gi"

        helper_cpu_request = "500m"
        helper_cpu_limit = "1000m"

        helper_memory_request = "256Mi"
        helper_memory_limit = "512Mi"

        poll_timeout = 600

        service_account_overwrite_allowed = ""

runnerToken: ""


podAnnotations:
  secret.reloader.stakater.com/reload: "gitlab-runner-secret"

