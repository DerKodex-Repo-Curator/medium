apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: authentik-postgresql-secret
  namespace: authentik

spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: authentik-postgresql-secret
    creationPolicy: Owner

  data:
    - secretKey: postgres-admin-password
      remoteRef:
        key: authentik-postgres-admin-password

    - secretKey: authentik-user-password
      remoteRef:
        key: authentik-postgres-user-password