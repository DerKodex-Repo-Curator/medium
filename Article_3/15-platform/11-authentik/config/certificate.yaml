apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: authentik
spec:
  secretName: authentik-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    # auth.<your_domain> has cert managed by cloudflare tunnel
   # - auth.<your_domain>
   # this domain is only for internal VPN-based access. Using it for SSO will fail.
   - authentik.<your_domain>
