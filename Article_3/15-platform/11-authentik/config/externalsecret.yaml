apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: authentik-secret
  namespace: authentik

spec:
  refreshInterval: 1m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: authentik-secret
    creationPolicy: Owner

  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik-secret-key