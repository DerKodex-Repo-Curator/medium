apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: authentik
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`authentik.<your_domain>`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80

  tls:
    secretName: authentik-tls
---
# For cloudflare DNS record should not be created with extrenal-dns, so here we remove external dns annotation
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: authentik-cloudflared
  namespace: authentik
spec:
  entryPoints:
    - cloudflared

  routes:
    - match: Host(`auth.<your_domain>`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  # tls:
  #   secretName: authentik-tls
