apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: authentik
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "510"

spec:

  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'

  project: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  sources:

    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.6

      helm:
        valueFiles:
          - $values/15-platform/11-authentik/values.yaml

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 15-platform/11-authentik/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
