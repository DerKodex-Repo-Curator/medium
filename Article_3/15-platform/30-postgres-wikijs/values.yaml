auth:
  username: wikijs
  database: wikijs

  existingSecret: wikijs-postgresql-secret

  secretKeys:
    adminPasswordKey: postgres-admin-password
    userPasswordKey: wikijs-user-password

primary:
  podAnnotations:
    reloader.stakater.com/auto: "true"

  persistence:
    enabled: true
    storageClass: longhorn
    size: 25Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi

    limits:
      cpu: 1500m
      memory: 2Gi

metrics:
  enabled: true

  serviceMonitor:
    enabled: true

volumePermissions:
  enabled: true

networkPolicy:
  enabled: true