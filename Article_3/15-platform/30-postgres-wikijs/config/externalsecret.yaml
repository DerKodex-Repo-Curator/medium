apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: wikijs-postgresql-secret
  namespace: wikijs

spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: wikijs-postgresql-secret
    creationPolicy: Owner

  data:
    - secretKey: postgres-admin-password
      remoteRef:
        key: wikijs-postgres-admin-password

    - secretKey: wikijs-user-password
      remoteRef:
        key: wikijs-postgres-user-password