apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: dvwa
  namespace: dvwa
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
    kubernetes.io/ingress.class: traefik
spec:

  entryPoints:
    - websecure

  routes:
    - match: Host(`dvwa.<your_domain>`)
      kind: Rule

      services:
        - name: dvwa
          port: 80

  tls:
    secretName: dvwa-tls