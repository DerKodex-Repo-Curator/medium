apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1005"

spec:
  ignoreDifferences:

    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/finalizers
  project: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  sources:

    - repoURL: https://prometheus-community.github.io/helm-charts#
      chart: kube-prometheus-stack
      targetRevision: 87.18.1

      helm:
        valueFiles:
          - $values/20-monitoring/10-kube-prometheus-stack/values.yaml

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 20-monitoring/10-kube-prometheus-stack/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
