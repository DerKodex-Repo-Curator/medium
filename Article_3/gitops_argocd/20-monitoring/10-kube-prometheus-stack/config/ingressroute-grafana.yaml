apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`grafana.<your_domain>`)
      kind: Rule

      services:
        - name: prometheus-grafana
          port: 80

  tls:
    secretName: grafana-tls