apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: alertmanager
  namespace: monitoring

  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>

spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`alertmanager.<your_domain>`)
      kind: Rule

      services:
        - name: prometheus-kube-prometheus-alertmanager
          port: 9093

  tls:
    secretName: alertmanager-tls