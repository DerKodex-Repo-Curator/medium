apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velero
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "70"

spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  sources:

    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0

      helm:
        valueFiles:
          - $values/10-infra/130-velero/values.yaml

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 10-infra/130-velero/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
