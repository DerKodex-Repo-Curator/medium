apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ui-admin
  namespace: velero-ui
spec:
  refreshInterval: 10m

  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore

  target:
    name: velero-ui-admin

  data:
    - secretKey: username
      remoteRef:
        key: velero-ui-admin-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: password
      remoteRef:
        key: velero-ui-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: velero-ui-oauth
  namespace: velero-ui

spec:
  refreshInterval: 10m

  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore

  target:
    name: velero-ui-oauth

  data:
    - secretKey: client-id
      remoteRef:
        key: velero-ui-oauth-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: client-secret
      remoteRef:
        key: velero-ui-oauth-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
