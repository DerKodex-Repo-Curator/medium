apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: velero-ui
  namespace: velero-ui

  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>

spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`velero.<your_domain>`)
      kind: Rule

      services:
        - name: velero-ui
          port: 3000

  tls:
    secretName: velero-ui-tls