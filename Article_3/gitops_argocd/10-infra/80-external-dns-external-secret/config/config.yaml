apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: cloudflare-api-token
    creationPolicy: Owner

  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token