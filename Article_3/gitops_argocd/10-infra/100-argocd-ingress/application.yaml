apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
    targetRevision: main
    path: 10-infra/100-argocd-ingress/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true