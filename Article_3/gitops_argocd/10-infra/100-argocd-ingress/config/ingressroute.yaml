apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:

    - match: Host(`argocd.<your_domain>`)
      kind: Rule

      services:
        - name: argocd-server
          port: 80         
  tls:
    secretName: argocd-tls
