apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: velero-azure-credentials
  namespace: velero

spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: velero-azure-credentials
    creationPolicy: Owner

    template:
      engineVersion: v2

      data:
        cloud: |
          AZURE_SUBSCRIPTION_ID={{ .subscriptionId }}
          AZURE_TENANT_ID={{ .tenantId }}
          AZURE_CLIENT_ID={{ .clientId }}
          AZURE_CLIENT_SECRET={{ .clientSecret }}
          AZURE_RESOURCE_GROUP={{ .resourceGroup }}
          AZURE_CLOUD_NAME=AzurePublicCloud

  data:
    - secretKey: clientId
      remoteRef:
        key: k8s-backup-to-<your_domain>blobbackup-app-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: clientSecret
      remoteRef:
        key: k8s-backup-to-<your_domain>blobbackup-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: subscriptionId
      remoteRef:
        key: k8s-azure-subscription-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tenantId
      remoteRef:
        key: k8s-azure-tenant-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: resourceGroup
      remoteRef:
        key: k8s-azure-resource-group
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
