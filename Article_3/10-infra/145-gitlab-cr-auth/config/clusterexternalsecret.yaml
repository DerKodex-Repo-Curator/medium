apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret

metadata:
  name: gitlab-cr-auth

spec:
  externalSecretName: gitlab-registry

  refreshTime: 10m

  namespaceSelectors:
    - matchLabels:
        gitlab-registry-access: "true"

  externalSecretSpec:

    refreshInterval: 10m

    secretStoreRef:
      kind: ClusterSecretStore
      name: azure-kv

    target:
      name: gitlab-registry

      template:
        type: kubernetes.io/dockerconfigjson

        data:
          .dockerconfigjson: |
            {
              "auths": {
                "cr.<your_domain>": {
                  "username": "{{ .username }}",
                  "password": "{{ .password }}",
                  "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
                }
              }
            }

    data:

      - secretKey: username
        remoteRef:
          key: gitlab-cr-username
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None

      - secretKey: password
        remoteRef:
          key: gitlab-cr-password
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None