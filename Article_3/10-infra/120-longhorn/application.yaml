apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  project: infra

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  sources:

    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0

      helm:
        valueFiles:
          - $values/10-infra/120-longhorn/values.yaml

    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      ref: values
      
    - repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
      targetRevision: main
      path: 10-infra/120-longhorn/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true