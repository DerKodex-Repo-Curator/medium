apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: longhorn-backup-secret
  namespace: longhorn-system

spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: longhorn-backup-secret
    creationPolicy: Owner

  data:
    - secretKey: AZBLOB_ACCOUNT_NAME
      remoteRef:
        key: k8s-backup-storage-account-name
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: AZBLOB_ACCOUNT_KEY
      remoteRef:
        key: k8s-backup-storage-account-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
