apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-secrets
  namespace: argocd

spec:
  project: infra

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  source:
    repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
    targetRevision: main
    path: 10-infra/20-cert-manager-external-secret/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true