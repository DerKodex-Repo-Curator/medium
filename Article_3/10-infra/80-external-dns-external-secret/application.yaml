apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  project: infra

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  source:
    repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
    targetRevision: main
    path: 10-infra/80-external-dns-external-secret/config

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true