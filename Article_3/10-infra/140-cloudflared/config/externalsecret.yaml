apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: cloudflared
  namespace: cloudflared

spec:
  refreshInterval: 10m

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv

  target:
    name: cloudflared
    creationPolicy: Owner

  data:
    - secretKey: tunnel-token
      remoteRef:
        key: cloudflared-tunnel-token-k8s