apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.<your_domain>
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure

  routes:

    - match: Host(`prometheus.<your_domain>`)
      kind: Rule
      services:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
  tls:
    secretName: prometheus-tls