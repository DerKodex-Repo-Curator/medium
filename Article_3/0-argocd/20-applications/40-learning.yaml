apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learning
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2000"
spec:
  project: learning

  source:
    repoURL: https://gitlab.<your_domain>/cloud-team/<your_domain>-infra/gitops.git
    targetRevision: main
    path: 40-learning
    directory:
      recurse: true
      include: "*/application.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
